<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Matrix — 입력기 / Editor</title>
<style>
:root{
  --ink:#14171c; --ink-2:#3d434d; --muted:#6b727d;
  --rule:#c3c9d1; --hair:#e2e6ea; --accent:#1f4b73;
  --bg:#f6f7f9; --panel:#fff; --tint:#eceef2;
  --sans:"Noto Sans KR","Noto Sans CJK KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Noto Sans Mono CJK KR",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);
  word-break:keep-all;overflow-wrap:break-word}

/* ---- top bar ---- */
header.bar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header.bar h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em}
header.bar .sp{flex:1}
header.bar .st{font-size:11px;color:#aeb6c0}
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
button{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:5px 11px;cursor:pointer}
button:hover{background:var(--tint)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.15)}
button.gh{background:transparent;border-color:#4a525d;color:#fff}
button.gh:hover{background:#2a3038}
button.sm{padding:2px 7px;font-size:11px;border-radius:4px}
button.dg{color:#8a2b2b;border-color:#d8bcbc}

/* ---- layout ---- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 120px}
section.card{background:var(--panel);border:1px solid var(--hair);border-radius:8px;margin-bottom:14px}
section.card>h2{margin:0;padding:11px 14px;font-size:13px;font-weight:700;letter-spacing:.02em;
  border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#fafbfc);border-radius:8px 8px 0 0}
section.card>h2 .cnt{font-weight:400;color:var(--muted);font-size:11px}
section.card>h2 .tw{margin-left:auto;color:var(--muted);font-size:11px}
section.card>.body{padding:14px}
section.card.closed>.body{display:none}
section.card.closed>h2{border-bottom:none;border-radius:8px}

.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:block}
label.f>span{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:700;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;border:1px solid var(--rule);border-radius:5px;padding:6px 8px;background:#fff}
textarea{resize:vertical;min-height:56px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid #b9cde0;outline-offset:-1px;border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0 0 10px}
.hint b{color:var(--ink-2)}

/* ---- repeatable rows ---- */
.item{border:1px solid var(--hair);border-radius:7px;padding:11px;margin-bottom:10px;background:#fcfdfe}
.item>.ih{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.item>.ih .n{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--ink-2);
  border-radius:50%;width:19px;height:19px;display:grid;place-items:center;flex:0 0 19px}
.item>.ih .t{font-weight:700;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addbtn{margin-top:2px}

/* ---- matrix grid ---- */
.mxwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:#fff}
table.mx{border-collapse:collapse;min-width:100%}
table.mx th,table.mx td{border:1px solid var(--hair);padding:5px;vertical-align:top}
table.mx thead th{background:var(--tint);position:sticky;top:0}
table.mx th.rl,table.mx td.rl{background:#f7f8fa;min-width:130px;position:sticky;left:0;z-index:2}
table.mx thead th.rl{z-index:3}
table.mx td{min-width:170px}
table.mx textarea{min-height:52px;font-size:12.5px;border-color:var(--hair)}
table.mx input{font-size:12.5px;border-color:var(--hair)}
.colhd{display:flex;flex-direction:column;gap:4px}
.colhd .rw{display:flex;gap:4px;align-items:center}
select.mk{font-size:10.5px;padding:2px 4px;border-radius:4px;width:auto;flex:1}
.mk-core{background:#fff}.mk-distinction{background:#eceef2}.mk-exception{background:#f0ece5}
.mk-trap{background:#e7e5e9}.mk-update{background:#fff}.mk-evidence{background:#f2f4f6}
td.c-distinction{background:#f6f7f9}td.c-exception{background:#faf7f2}td.c-trap{background:#f4f3f5}

/* ---- YAML pane ---- */
.yamlwrap{position:fixed;inset:auto 0 0 0;background:#12161b;color:#d6dde6;z-index:60;
  border-top:2px solid var(--accent);display:flex;flex-direction:column;max-height:70vh}
.yamlwrap.hidden{display:none}
.yamlwrap .yh{display:flex;align-items:center;gap:9px;padding:7px 14px;border-bottom:1px solid #2a3038;font-size:12px}
.yamlwrap pre{margin:0;padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre}
.footbar{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--rule);
  display:flex;gap:9px;align-items:center;padding:9px 16px;z-index:55;flex-wrap:wrap}
.footbar .sp{flex:1}
.footbar .msg{font-size:11.5px;color:var(--muted)}
.warn{background:#fdf6e7;border:1px solid #e8d9ae;border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.warn ul{margin:5px 0 0;padding-left:18px}
</style>
</head>
<body>

<header class="bar">
  <h1>Exam Matrix</h1>
  <span class="st" id="subtitle"></span>
  <span class="sp"></span>
  <button class="gh" id="btnLang">EN</button>
  <button class="gh" id="btnLoad" data-i="load">불러오기</button>
  <input type="file" id="fileIn" accept=".yaml,.yml" hidden>
  <button class="gh" id="btnSample" data-i="sample">예시 채우기</button>
  <button class="gh" id="btnClear" data-i="clear">비우기</button>
</header>

<main id="app"></main>

<div class="footbar">
  <button class="pri" id="btnDl" data-i="download">YAML 내려받기</button>
  <button id="btnCopy" data-i="copy">복사</button>
  <button id="btnYaml" data-i="showyaml">YAML 보기</button>
  <span class="sp"></span>
  <span class="msg" id="msg"></span>
</div>

<div class="yamlwrap hidden" id="yamlPane">
  <div class="yh"><b>exam.yaml</b><span class="sp" style="flex:1"></span>
    <button class="sm" id="btnYamlClose">닫기</button></div>
  <pre id="yamlOut"></pre>
</div>

/* -------------------------------------------------------------- utilities */

const esc = (s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const slug = (s)=>String(s||"").toLowerCase().normalize("NFKD")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
const splitLines = (s)=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const splitCommas = (s)=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);

/* ------------------------------------------------------------ YAML output */

function needsQuote(s){
  if(s==="") return true;
  if(/^[\s]|[\s]$/.test(s)) return true;
  if(/^[-?:,\[\]{}#&*!|>'"%@`]/.test(s)) return true;
  if(/:\s/.test(s) || /\s#/.test(s)) return true;
  if(/^(true|false|null|yes|no|on|off|~)$/i.test(s)) return true;
  if(/^[-+]?[0-9.]+([eE][-+]?\d+)?$/.test(s)) return true;
  return false;
}
function sc(v){
  const s = String(v ?? "");
  if(!needsQuote(s)) return s;
  return '"' + s.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';
}
/** Long prose becomes a folded block scalar, which is how the examples read. */
function scalar(v, indent){
  const s = String(v ?? "");
  if(s.length <= 78 && !s.includes("\n")) return sc(s);
  const pad = " ".repeat(indent);
  const words = s.replace(/\s+/g," ").trim().split(" ");
  const out=[]; let line="";
  for(const w of words){
    if((line+" "+w).trim().length > 74){ out.push(line.trim()); line=w; }
    else line += " " + w;
  }
  if(line.trim()) out.push(line.trim());
  return ">-\n" + out.map(l=>pad+l).join("\n");
}
const listOf = (arr, indent)=> arr.length
  ? "\n" + arr.map(x=>" ".repeat(indent)+"- "+sc(x)).join("\n")
  : " []";

function buildYaml(){
  const e = S.exam, L=[];
  const lang = e.lang === "en" ? "en" : "ko";
  const lbl = (c)=> lang==="ko" ? (c.label_ko||c.label||c.key) : (c.label||c.label_ko||c.key);

  L.push("# " + (e.name || "Exam Matrix"));
  L.push("# Exam Matrix — generated by tools/editor.html");
  L.push("");
  L.push("exam:");
  L.push("  name: " + sc(e.name));
  if(e.name_sub) L.push("  name_sub: " + sc(e.name_sub));
  L.push("  lang: " + lang);
  if(e.authority) L.push("  authority: " + sc(e.authority));
  if(e.date) L.push("  date: " + sc(e.date));
  if(e.syllabus_version) L.push("  syllabus_version: " + sc(e.syllabus_version));
  if(e.passing) L.push("  passing: " + sc(e.passing));
  if(e.target_score!=="" ) L.push("  target_score: " + sc(e.target_score));
  if(e.confidence) L.push("  confidence: " + Number(e.confidence));
  if(e.last_updated) L.push("  last_updated: " + sc(e.last_updated));
  L.push("  subjects:" + listOf(splitLines(e.subjects), 4));
  L.push("  sources:" + listOf(splitLines(e.sources), 4));
  const wt = splitLines(e.what_it_tests);
  if(wt.length){ L.push("  what_it_tests:" + listOf(wt, 4)); }
  if(e.blueprint.length){
    L.push("  blueprint:");
    for(const b of e.blueprint){
      L.push("    - domain: " + sc(b.domain));
      if(b.weight!=="") L.push("      weight: " + (isNaN(Number(b.weight))?sc(b.weight):Number(b.weight)));
      if(b.question_type) L.push("      question_type: " + sc(b.question_type));
      if(b.priority) L.push("      priority: " + b.priority);
      if(b.confidence) L.push("      confidence: " + Number(b.confidence));
      if(b.last_review) L.push("      last_review: " + sc(b.last_review));
    }
  }
  L.push("  high_yield:" + listOf(splitLines(e.high_yield), 4));
  L.push("  weak:" + listOf(splitLines(e.weak), 4));
  L.push("  volatile:" + listOf(splitLines(e.volatile), 4));
  L.push("");
  L.push("topics:");

  S.topics.forEach((tp, ti)=>{
    const id = tp.id || slug(tp.title) || ("topic-"+(ti+1));
    L.push("  - id: " + id);
    L.push("    title: " + sc(tp.title));
    L.push("    archetype: " + tp.archetype);
    if(tp.importance) L.push("    importance: " + tp.importance);
    if(tp.frequency) L.push("    frequency: " + sc(tp.frequency));
    if(tp.why) L.push("    why: " + scalar(tp.why, 6));
    if(tp.core_question) L.push("    core_question: " + sc(tp.core_question));
    if(tp.key_axis) L.push("    key_axis: " + sc(tp.key_axis));
    const pre = splitCommas(tp.prerequisites);
    if(pre.length) L.push("    prerequisites: [" + pre.map(sc).join(", ") + "]");
    const src = splitCommas(tp.sources);
    if(src.length) L.push("    sources: [" + src.map(sc).join(", ") + "]");
    if(tp.updated) L.push("    updated: " + sc(tp.updated));
    if(tp.one_sentence) L.push("    one_sentence: " + scalar(tp.one_sentence, 6));
    const ess = tp.essentials.map(x=>String(x||"").trim()).filter(Boolean).slice(0,5);
    if(ess.length) L.push("    essentials:" + listOf(ess, 6));

    L.push("");
    L.push("    matrix:");
    if(tp.matrix.row_label) L.push("      row_label: " + sc(tp.matrix.row_label));
    if(tp.matrix.note) L.push("      note: " + sc(tp.matrix.note));
    L.push("      columns:");
    tp.matrix.columns.forEach(c=>{
      const parts = ["key: "+c.key];
      if(c.label) parts.push("label: "+sc(c.label));
      if(c.label_ko) parts.push("label_ko: "+sc(c.label_ko));
      parts.push("mark: "+(c.mark||"core"));
      L.push("        - { " + parts.join(", ") + " }");
    });
    L.push("      rows:");
    tp.matrix.rows.forEach(r=>{
      L.push("        - label: " + sc(r.label));
      if(r.sub) L.push("          sub: " + sc(r.sub));
      const keys = tp.matrix.columns.filter(c=>{
        const cell = r.cells[c.key]; return cell && String(cell.v||"").trim();
      });
      if(keys.length){
        L.push("          cells:");
        keys.forEach(c=>{
          const cell = r.cells[c.key];
          const v = String(cell.v).trim();
          if(cell.mark && cell.mark !== c.mark){
            L.push("            " + c.key + ": { v: " + sc(v) + ", mark: " + cell.mark + " }");
          } else {
            L.push("            " + c.key + ": " + sc(v));
          }
        });
      }
    });

    const d = tp.decisive;
    if(d.answer || d.pairs.length){
      L.push("");
      L.push("    decisive:");
      if(d.answer) L.push("      answer: " + scalar(d.answer, 8));
      if(d.pairs.length){
        L.push("      pairs:");
        d.pairs.forEach(p=>{
          L.push("        - a: " + sc(p.a));
          L.push("          b: " + sc(p.b));
          if(p.why) L.push("          why: " + sc(p.why));
          if(p.clue) L.push("          clue: " + sc(p.clue));
        });
      }
    }
    if(tp.traps.length){
      L.push("");
      L.push("    traps:");
      tp.traps.forEach(x=>{
        L.push("      - cue: " + sc(x.cue));
        if(x.usually) L.push("        usually: " + sc(x.usually));
        if(x.exception) L.push("        exception: " + sc(x.exception));
        if(x.why) L.push("        why: " + sc(x.why));
        if(x.source) L.push("        source: " + sc(x.source));
      });
    }
    if(tp.evidence.length){
      L.push("");
      L.push("    evidence:");
      tp.evidence.forEach(x=>{
        L.push("      - cell: { row: " + sc(x.row) + ", column: " + (x.column||"") + " }");
        if(x.source) L.push("        source: " + sc(x.source));
        if(x.exam) L.push("        exam: " + sc(x.exam));
        if(x.question) L.push("        question: " + sc(x.question));
        if(x.tested_as) L.push("        tested_as: " + sc(x.tested_as));
        if(x.risk) L.push("        risk: " + x.risk);
      });
    }
    L.push("");
  });

  if(S.error_log.length){
    L.push("error_log:");
    S.error_log.forEach(x=>{
      L.push("  - date: " + sc(x.date));
      if(x.question) L.push("    question: " + sc(x.question));
      if(x.topic) L.push("    topic: " + sc(x.topic));
      if(x.mine) L.push("    mine: " + sc(x.mine));
      if(x.correct) L.push("    correct: " + sc(x.correct));
      if(x.error_type) L.push("    error_type: " + x.error_type);
      if(x.missing_distinction) L.push("    missing_distinction: " + sc(x.missing_distinction));
      if(x.mt && x.mrow && x.mcol)
        L.push("    matrix_update: { topic: " + x.mt + ", row: " + sc(x.mrow) + ", column: " + x.mcol + " }");
      if(x.retest) L.push("    retest: " + sc(x.retest));
    });
    L.push("");
  }

  const l3 = splitLines(S.compression.l3);
  if(S.compression.l2.length || l3.length){
    L.push("compression:");
    if(S.compression.l2.length){
      L.push("  l2:");
      S.compression.l2.forEach(x=>{
        L.push("    - item: " + sc(x.item));
        if(x.detail) L.push("      detail: " + sc(x.detail));
        if(x.mark) L.push("      mark: " + x.mark);
      });
    } else L.push("  l2: []");
    L.push("  l3:" + listOf(l3, 4));
    L.push("");
  }
  L.push("blank_rows:");
  L.push("  error_log: 9");
  return L.join("\n") + "\n";
}

/* ------------------------------------------------------------ YAML import */

function importYaml(text){
  const d = jsyaml.load(text);
  if(!d || !d.exam) throw new Error("exam: block not found");
  const e = d.exam;
  const st = blankState();
  st.exam = {
    name:e.name||"", name_sub:e.name_sub||"", lang:e.lang==="en"?"en":"ko",
    authority:e.authority||"", date:e.date||"", passing:e.passing||"",
    syllabus_version:e.syllabus_version||"", target_score:e.target_score??"",
    confidence:e.confidence||"", last_updated:e.last_updated||"",
    subjects:(e.subjects||[]).join("\n"), sources:(e.sources||[]).join("\n"),
    what_it_tests:(e.what_it_tests||[]).join("\n"),
    blueprint:(e.blueprint||[]).map(b=>({domain:b.domain||"",weight:b.weight??"",
      question_type:b.question_type||"",priority:b.priority||"",confidence:b.confidence||"",
      last_review:b.last_review||""})),
    high_yield:(e.high_yield||[]).join("\n"), weak:(e.weak||[]).join("\n"),
    volatile:(e.volatile||[]).join("\n"),
  };
  st.topics = (d.topics||[]).map(tp=>{
    const m = tp.matrix||{};
    const cols = (m.columns||[]).map(c=>({key:c.key,label:c.label||"",label_ko:c.label_ko||"",mark:c.mark||"core"}));
    const rows = (m.rows||[]).map(r=>{
      const cells={};
      for(const c of cols){
        const raw = (r.cells||{})[c.key];
        if(raw===undefined||raw===null) { cells[c.key]={v:"",mark:c.mark}; continue; }
        if(typeof raw === "object") cells[c.key]={v:String(raw.v??raw.value??""),mark:raw.mark||c.mark};
        else cells[c.key]={v:String(raw),mark:c.mark};
      }
      return {label:r.label||"",sub:r.sub||"",cells};
    });
    const ess = (tp.essentials||[]).slice(0,5);
    while(ess.length<5) ess.push("");
    return {
      id:tp.id||"", title:tp.title||"", archetype:ARCH[tp.archetype]?tp.archetype:"concept",
      importance:tp.importance||"A", frequency:tp.frequency||"", why:tp.why||"",
      core_question:tp.core_question||"", key_axis:tp.key_axis||"",
      prerequisites:(tp.prerequisites||[]).join(", "), sources:(tp.sources||[]).join(", "),
      updated:tp.updated||"", one_sentence:tp.one_sentence||"", essentials:ess,
      matrix:{row_label:m.row_label||"",note:m.note||"",columns:cols,rows:rows},
      decisive:{answer:(tp.decisive||{}).answer||"",
        pairs:((tp.decisive||{}).pairs||[]).map(p=>({a:p.a||"",b:p.b||"",why:p.why||"",clue:p.clue||""}))},
      traps:(tp.traps||[]).map(x=>({cue:x.cue||"",usually:x.usually||"",exception:x.exception||"",
        why:x.why||"",source:x.source||""})),
      evidence:(tp.evidence||[]).map(x=>({row:(x.cell||{}).row||"",column:(x.cell||{}).column||"",
        source:x.source||"",exam:x.exam||"",question:x.question||"",tested_as:x.tested_as||"",risk:x.risk||""})),
    };
  });
  if(!st.topics.length) st.topics=[blankTopic()];
  st.error_log = (d.error_log||[]).map(x=>({date:x.date||"",question:x.question||"",topic:x.topic||"",
    mine:x.mine||"",correct:x.correct||"",error_type:x.error_type||"",
    missing_distinction:x.missing_distinction||"",
    mt:(x.matrix_update||{}).topic||"", mrow:(x.matrix_update||{}).row||"",
    mcol:(x.matrix_update||{}).column||"", retest:x.retest||""}));
  st.compression = {
    l2:((d.compression||{}).l2||[]).map(x=>({item:x.item||"",detail:x.detail||"",mark:x.mark||""})),
    l3:(((d.compression||{}).l3)||[]).join("\n"),
  };
  S = st;
  render(); save();
}

/* --------------------------------------------------------------- rendering */

function card(id, title, count, bodyHtml){
  const closed = S.open[id] === false ? " closed" : "";
  return `<section class="card${closed}" data-card="${id}">
    <h2 data-toggle="${id}">${esc(title)}${count!=null?`<span class="cnt">${count}</span>`:""}
      <span class="tw">${closed?"▸":"▾"}</span></h2>
    <div class="body">${bodyHtml}</div></section>`;
}
function fld(label, path, type="text", opts){
  const v = get(path);
  if(type==="textarea") return `<label class="f"><span>${esc(label)}</span>
    <textarea data-p="${path}">${esc(v)}</textarea></label>`;
  if(type==="select") return `<label class="f"><span>${esc(label)}</span>
    <select data-p="${path}">${opts.map(o=>{
      const [val,txt]=Array.isArray(o)?o:[o,o];
      return `<option value="${esc(val)}"${String(v)===String(val)?" selected":""}>${esc(txt)}</option>`;
    }).join("")}</select></label>`;
  return `<label class="f"><span>${esc(label)}</span>
    <input type="${type}" data-p="${path}" value="${esc(v)}"></label>`;
}
function get(path){
  return path.split(".").reduce((o,k)=>{
    if(o==null) return "";
    const i = /^\d+$/.test(k) ? Number(k) : k;
    return o[i];
  }, S) ?? "";
}
function set(path, val){
  const ks = path.split(".");
  let o = S;
  for(let i=0;i<ks.length-1;i++){
    const k = /^\d+$/.test(ks[i]) ? Number(ks[i]) : ks[i];
    o = o[k];
  }
  const last = ks[ks.length-1];
  o[/^\d+$/.test(last)?Number(last):last] = val;
}

function matrixEditor(tp, ti){
  const cols = tp.matrix.columns;
  const head = cols.map((c,ci)=>`<th>
    <div class="colhd">
      <input type="text" data-p="topics.${ti}.matrix.columns.${ci}.${S.exam.lang==="ko"?"label_ko":"label"}"
        value="${esc(S.exam.lang==="ko"?(c.label_ko||""):(c.label||""))}" placeholder="${esc(t("e_col"))}">
      <div class="rw">
        <select class="mk mk-${c.mark}" data-p="topics.${ti}.matrix.columns.${ci}.mark">
          ${MARKS.map(m=>`<option value="${m}"${c.mark===m?" selected":""}>${m}</option>`).join("")}
        </select>
        <button class="sm dg" data-act="delcol" data-t="${ti}" data-c="${ci}">✕</button>
      </div>
    </div></th>`).join("");

  const body = tp.matrix.rows.map((r,ri)=>{
    const cells = cols.map((c,ci)=>{
      const cell = r.cells[c.key] || (r.cells[c.key]={v:"",mark:c.mark});
      const cls = cell.mark && cell.mark!=="core" ? ` class="c-${cell.mark}"` : "";
      return `<td${cls}>
        <textarea data-cell="${ti}.${ri}.${c.key}" placeholder="">${esc(cell.v)}</textarea>
        <select class="mk mk-${cell.mark}" data-cellmark="${ti}.${ri}.${c.key}">
          ${MARKS.map(m=>`<option value="${m}"${cell.mark===m?" selected":""}>${m}</option>`).join("")}
        </select></td>`;
    }).join("");
    return `<tr><td class="rl">
        <input type="text" data-p="topics.${ti}.matrix.rows.${ri}.label" value="${esc(r.label)}" placeholder="${esc(t("e_row"))}">
        <input type="text" data-p="topics.${ti}.matrix.rows.${ri}.sub" value="${esc(r.sub)}" placeholder="sub" style="margin-top:4px;font-size:11.5px">
        <button class="sm dg" data-act="delrow" data-t="${ti}" data-r="${ri}" style="margin-top:4px">✕</button>
      </td>${cells}</tr>`;
  }).join("");

  return `<p class="hint">${t("hint_matrix")}</p>
    <div class="grid g2" style="margin-bottom:9px">
      ${fld(t("row_label"), `topics.${ti}.matrix.row_label`)}
      ${fld(t("mnote"), `topics.${ti}.matrix.note`)}
    </div>
    <div class="mxwrap"><table class="mx">
      <thead><tr><th class="rl">${esc(t("row_label"))}</th>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div style="margin-top:8px;display:flex;gap:7px">
      <button class="sm" data-act="addrow" data-t="${ti}">+ ${esc(t("add_row"))}</button>
      <button class="sm" data-act="addcol" data-t="${ti}">+ ${esc(t("add_col"))}</button>
    </div>`;
}

    <div class="grid g2" style="margin-top:10px">

      ${fld(t("core_q"), `topics.${ti}.core_question`)}
    </div>
    <div class="grid g2" style="margin-top:10px">
      ${fld(t("prereq"), `topics.${ti}.prerequisites`)}
      ${fld(t("tsources"), `topics.${ti}.sources`)}
    </div>
    <div style="margin-top:10px">${fld(t("why"), `topics.${ti}.why`, "textarea")}</div>
    <div style="margin-top:10px">${fld(t("one_sentence"), `topics.${ti}.one_sentence`, "textarea")}</div>

    <h3 style="font-size:12px;margin:16px 0 4px">${esc(t("essentials"))}</h3>
    <p class="hint">${t("hint_ess")}</p>
    ${tp.essentials.map((v,i)=>`<div style="display:flex;gap:7px;align-items:center;margin-bottom:6px">
      <span style="font-family:var(--mono);font-size:11px;color:var(--muted);width:14px">${i+1}</span>
      <input type="text" data-p="topics.${ti}.essentials.${i}" value="${esc(v)}"></div>`).join("")}

    <h3 style="font-size:12px;margin:18px 0 6px">${esc(t("matrix"))}</h3>
    ${matrixEditor(tp, ti)}

    <h3 style="font-size:12px;margin:18px 0 6px">${esc(t("decisive"))}</h3>
    ${fld(t("decisive_a"), `topics.${ti}.decisive.answer`, "textarea")}
    ${tp.decisive.pairs.map((p,pi)=>`<div class="item" style="margin-top:9px">
      <div class="ih"><span class="n">${pi+1}</span><span class="t">${esc(p.a||"")} / ${esc(p.b||"")}</span>
        <button class="sm dg" data-act="delpair" data-t="${ti}" data-i="${pi}">${esc(t("del"))}</button></div>
      <div class="grid g2">
        ${fld(t("p_a"), `topics.${ti}.decisive.pairs.${pi}.a`)}
        ${fld(t("p_b"), `topics.${ti}.decisive.pairs.${pi}.b`)}
      </div>
      <div class="grid g2" style="margin-top:8px">
        ${fld(t("p_why"), `topics.${ti}.decisive.pairs.${pi}.why`, "textarea")}
        ${fld(t("p_clue"), `topics.${ti}.decisive.pairs.${pi}.clue`, "textarea")}
      </div></div>`).join("")}
    <button class="sm addbtn" data-act="addpair" data-t="${ti}">+ ${esc(t("add_pair"))}</button>

    <h3 style="font-size:12px;margin:18px 0 6px">${esc(t("traps"))}</h3>
    ${tp.traps.map((x,xi)=>`<div class="item">
      <div class="ih"><span class="n">${xi+1}</span><span class="t">${esc(x.cue||"")}</span>
        <button class="sm dg" data-act="deltrap" data-t="${ti}" data-i="${xi}">${esc(t("del"))}</button></div>
      ${fld(t("t_cue"), `topics.${ti}.traps.${xi}.cue`, "textarea")}
      <div class="grid g2" style="margin-top:8px">
        ${fld(t("t_usually"), `topics.${ti}.traps.${xi}.usually`)}
        ${fld(t("t_src"), `topics.${ti}.traps.${xi}.source`)}
      </div>
      <div class="grid g2" style="margin-top:8px">
        ${fld(t("t_exc"), `topics.${ti}.traps.${xi}.exception`, "textarea")}
        ${fld(t("t_why"), `topics.${ti}.traps.${xi}.why`, "textarea")}
      </div></div>`).join("")}
    <button class="sm addbtn" data-act="addtrap" data-t="${ti}">+ ${esc(t("add_trap"))}</button>

    <h3 style="font-size:12px;margin:18px 0 6px">${esc(t("evidence"))}</h3>
    ${tp.evidence.map((x,xi)=>`<div class="item">
      <div class="ih"><span class="n">${xi+1}</span><span class="t">${esc(x.row||"")} · ${esc(x.column||"")}</span>
        <button class="sm dg" data-act="delev" data-t="${ti}" data-i="${xi}">${esc(t("del"))}</button></div>
      <div class="grid g3">
        ${fld(t("e_row"), `topics.${ti}.evidence.${xi}.row`, "select", [["",t("none")]].concat(rowOpts.map(r=>[r,r])))}
        ${fld(t("e_col"), `topics.${ti}.evidence.${xi}.column`, "select", [["",t("none")]].concat(colOpts))}
        ${fld(t("e_risk"), `topics.${ti}.evidence.${xi}.risk`, "select", [["",t("none")],["high","high"],["mid","mid"],["low","low"]])}
      </div>
      <div class="grid g3" style="margin-top:8px">
        ${fld(t("e_src"), `topics.${ti}.evidence.${xi}.source`)}
        ${fld(t("e_exam"), `topics.${ti}.evidence.${xi}.exam`)}
        ${fld(t("e_q"), `topics.${ti}.evidence.${xi}.question`)}
      </div>
      <div style="margin-top:8px">${fld(t("e_as"), `topics.${ti}.evidence.${xi}.tested_as`, "textarea")}</div>
    </div>`).join("")}
    <button class="sm addbtn" data-act="addev" data-t="${ti}">+ ${esc(t("add_ev"))}</button>

    <div style="margin-top:18px;border-top:1px solid var(--hair);padding-top:10px">
      <button class="sm dg" data-act="deltopic" data-t="${ti}">${esc(t("del"))} — ${esc(tp.title||t("s_topics"))}</button>
    </div>`;
  return card("topic"+ti, `${String(ti+1).padStart(2,"0")} · ${tp.title || t("s_topics")}`,
    `${tp.matrix.rows.length}×${tp.matrix.columns.length}`, body);
}

function render(){
  document.documentElement.lang = UI;
  document.getElementById("subtitle").textContent = S.exam.name || "";
  document.querySelectorAll("[data-i]").forEach(b=>b.textContent = t(b.dataset.i));
  document.getElementById("btnLang").textContent = UI==="ko" ? "EN" : "한국어";
  document.getElementById("btnYamlClose").textContent = t("close");

  const topicOpts = S.topics.map((x,i)=>[x.id||slug(x.title)||("topic-"+(i+1)), x.title||("#"+(i+1))]);

  const exam = card("exam", t("s_exam"), null, `
    <div class="grid g3">
      ${fld(t("name"), "exam.name")}
      ${fld(t("name_sub"), "exam.name_sub")}
      ${fld(t("lang"), "exam.lang", "select", [["ko","한국어"],["en","English"]])}
    </div>
    <div class="grid g3" style="margin-top:10px">
      ${fld(t("authority"), "exam.authority")}
      ${fld(t("date"), "exam.date", "date")}
      ${fld(t("updated"), "exam.last_updated", "date")}
    </div>
    <div class="grid g3" style="margin-top:10px">
      ${fld(t("passing"), "exam.passing")}
      ${fld(t("target"), "exam.target_score")}
      ${fld(t("confidence"), "exam.confidence", "select", [["",t("none")],1,2,3,4,5])}
    </div>
    <div style="margin-top:10px">${fld(t("version"), "exam.syllabus_version")}</div>
    <div class="grid g2" style="margin-top:10px">
      ${fld(t("subjects"), "exam.subjects", "textarea")}
      ${fld(t("sources"), "exam.sources", "textarea")}
    </div>
    <div style="margin-top:10px">${fld(t("what_tests"), "exam.what_it_tests", "textarea")}</div>`);

  const bp = card("bp", t("s_blueprint"), S.exam.blueprint.length, `
    ${S.exam.blueprint.map((b,i)=>`<div class="item">
      <div class="ih"><span class="n">${i+1}</span><span class="t">${esc(b.domain||"")}</span>
        <button class="sm dg" data-act="deldomain" data-i="${i}">${esc(t("del"))}</button></div>
      <div class="grid g3">
        ${fld(t("domain"), `exam.blueprint.${i}.domain`)}
        ${fld(t("weight"), `exam.blueprint.${i}.weight`)}
        ${fld(t("qtype"), `exam.blueprint.${i}.question_type`)}
      </div>
      <div class="grid g3" style="margin-top:8px">
        ${fld(t("priority"), `exam.blueprint.${i}.priority`, "select", ["A","B","C"])}
        ${fld(t("confidence"), `exam.blueprint.${i}.confidence`, "select", [["",t("none")],1,2,3,4,5])}
        ${fld(t("last_review"), `exam.blueprint.${i}.last_review`, "date")}
      </div></div>`).join("")}
    <button class="sm addbtn" data-act="adddomain">+ ${esc(t("add_domain"))}</button>
    <div class="grid g3" style="margin-top:14px">
      ${fld(t("high_yield"), "exam.high_yield", "textarea")}
      ${fld(t("weak"), "exam.weak", "textarea")}
      ${fld(t("volatile"), "exam.volatile", "textarea")}
    </div>`);

  const errs = card("errors", t("s_errors"), S.error_log.length, `
    <p class="hint">${t("hint_err")}</p>
    ${S.error_log.map((x,i)=>{
      const tp = S.topics.find(z=>(z.id||slug(z.title))===x.mt);
      const rowOpts = tp ? tp.matrix.rows.map(r=>r.label).filter(Boolean) : [];
      const colOpts = tp ? tp.matrix.columns.map(c=>[c.key,(S.exam.lang==="ko"?c.label_ko:c.label)||c.key]) : [];
      return `<div class="item">
      <div class="ih"><span class="n">${i+1}</span><span class="t">${esc(x.question||"")}</span>
        <button class="sm dg" data-act="delerr" data-i="${i}">${esc(t("del"))}</button></div>
      <div class="grid g3">
        ${fld(t("l_date"), `error_log.${i}.date`, "date")}
        ${fld(t("l_q"), `error_log.${i}.question`)}
        ${fld(t("l_topic"), `error_log.${i}.topic`)}
      </div>
      <div class="grid g3" style="margin-top:8px">
        ${fld(t("l_mine"), `error_log.${i}.mine`)}
        ${fld(t("l_correct"), `error_log.${i}.correct`)}
        ${fld(t("l_type"), `error_log.${i}.error_type`, "select", [["",t("none")]].concat(ETYPES.map(e=>[e,e])))}
      </div>
      <div style="margin-top:8px">${fld(t("l_missing"), `error_log.${i}.missing_distinction`, "textarea")}</div>
      <div class="grid g3" style="margin-top:8px">
        ${fld(t("l_update"), `error_log.${i}.mt`, "select", [["",t("none")]].concat(topicOpts))}
        ${fld(t("e_row"), `error_log.${i}.mrow`, "select", [["",t("none")]].concat(rowOpts.map(r=>[r,r])))}
        ${fld(t("e_col"), `error_log.${i}.mcol`, "select", [["",t("none")]].concat(colOpts))}
      </div>
      <div style="margin-top:8px;max-width:220px">${fld(t("l_retest"), `error_log.${i}.retest`, "date")}</div>
    </div>`;}).join("")}
    <button class="sm addbtn" data-act="adderr">+ ${esc(t("add_err"))}</button>`);

  const comp = card("comp", t("s_compress"), S.compression.l2.length, `
    <h3 style="font-size:12px;margin:0 0 8px">${esc(t("l2"))}</h3>
    ${S.compression.l2.map((x,i)=>`<div class="item">
      <div class="ih"><span class="n">${i+1}</span><span class="t">${esc(x.item||"")}</span>
        <button class="sm dg" data-act="dell2" data-i="${i}">${esc(t("del"))}</button></div>
      <div class="grid g3">
        ${fld(t("l2item"), `compression.l2.${i}.item`)}
        ${fld(t("l2detail"), `compression.l2.${i}.detail`)}
        ${fld("mark", `compression.l2.${i}.mark`, "select", [["",t("none")]].concat(MARKS.map(m=>[m,m])))}
      </div></div>`).join("")}
    <button class="sm addbtn" data-act="addl2">+ ${esc(t("add_l2"))}</button>
    <div style="margin-top:14px">${fld(t("l3"), "compression.l3", "textarea")}</div>`);

  document.getElementById("app").innerHTML =
    exam + bp +
    `<h2 style="font-size:13px;margin:18px 0 9px;letter-spacing:.02em">${esc(t("s_topics"))}</h2>` +
    S.topics.map(topicCard).join("") +
    `<button class="addbtn" data-act="addtopic" style="margin-bottom:16px">+ ${esc(t("add_topic"))}</button>` +
    errs + comp;

  document.getElementById("yamlOut").textContent = buildYaml();
}

/* ----------------------------------------------------------------- events */

document.getElementById("app").addEventListener("input", (ev)=>{
  const el = ev.target;
  if(el.dataset.p){ set(el.dataset.p, el.value); save();
    document.getElementById("yamlOut").textContent = buildYaml();
    if(/topics\.\d+\.title|exam\.name/.test(el.dataset.p)) softLabels();
    return; }
  if(el.dataset.cell){
    const [ti,ri,key] = el.dataset.cell.split(".");
    S.topics[ti].matrix.rows[ri].cells[key].v = el.value;
    save(); document.getElementById("yamlOut").textContent = buildYaml(); return;
  }
});
document.getElementById("app").addEventListener("change", (ev)=>{
  const el = ev.target;
  if(el.dataset.cellmark){
    const [ti,ri,key] = el.dataset.cellmark.split(".");
    S.topics[ti].matrix.rows[ri].cells[key].mark = el.value;
    render(); save(); return;
  }
  if(el.dataset.p && (/\.mark$|archetype$|exam\.lang$/.test(el.dataset.p))){
    if(/archetype$/.test(el.dataset.p)){
      const ti = Number(el.dataset.p.split(".")[1]);
      const a = ARCH[el.value];
      const tp = S.topics[ti];
      // Only replace the axes when the learner has not written any yet.
      const untouched = tp.matrix.rows.every(r=>Object.values(r.cells||{}).every(c=>!String(c.v||"").trim()));
      if(untouched){
        tp.matrix.columns = a.cols.slice(0,5).map(([k,ko,en,mk])=>({key:k,label_ko:ko,label:en,mark:mk}));
        tp.matrix.rows.forEach(r=>{ r.cells={}; });
        if(!tp.matrix.row_label) tp.matrix.row_label = a.row[S.exam.lang==="ko"?"ko":"en"];
      }
    }
    render(); save(); return;
  }
});
document.getElementById("app").addEventListener("click", (ev)=>{
  const tg = ev.target.closest("[data-toggle]");
  if(tg){ const id=tg.dataset.toggle; S.open[id] = S.open[id]===false; render(); save(); return; }
  const b = ev.target.closest("[data-act]");
  if(!b) return;
  const a = b.dataset.act, ti = Number(b.dataset.t), i = Number(b.dataset.i);
  const tp = S.topics[ti];
  if(a==="addtopic") S.topics.push(blankTopic(S.topics.at(-1)?.archetype || "concept"));
  if(a==="deltopic" && confirm(t("confirm_clear"))) S.topics.splice(ti,1);
  if(a==="addrow") tp.matrix.rows.push({label:"",sub:"",cells:{}});
  if(a==="delrow") tp.matrix.rows.splice(Number(b.dataset.r),1);
  if(a==="addcol"){
    let n = tp.matrix.columns.length+1, key = "col"+n;
    while(tp.matrix.columns.some(c=>c.key===key)) key = "col"+(++n);
    tp.matrix.columns.push({key,label:"",label_ko:"",mark:"core"});
  }
  if(a==="delcol") tp.matrix.columns.splice(Number(b.dataset.c),1);
  if(a==="addpair") tp.decisive.pairs.push({a:"",b:"",why:"",clue:""});
  if(a==="delpair") tp.decisive.pairs.splice(i,1);
  if(a==="addtrap") tp.traps.push({cue:"",usually:"",exception:"",why:"",source:""});
  if(a==="deltrap") tp.traps.splice(i,1);
  if(a==="addev") tp.evidence.push({row:"",column:"",source:"",exam:"",question:"",tested_as:"",risk:""});
  if(a==="delev") tp.evidence.splice(i,1);
  if(a==="adddomain") S.exam.blueprint.push({domain:"",weight:"",question_type:"",priority:"A",confidence:"",last_review:""});
  if(a==="deldomain") S.exam.blueprint.splice(i,1);
  if(a==="adderr") S.error_log.push({date:"",question:"",topic:"",mine:"",correct:"",error_type:"",
    missing_distinction:"",mt:"",mrow:"",mcol:"",retest:""});
  if(a==="delerr") S.error_log.splice(i,1);
  if(a==="addl2") S.compression.l2.push({item:"",detail:"",mark:""});
  if(a==="dell2") S.compression.l2.splice(i,1);
  if(!S.topics.length) S.topics=[blankTopic()];
  render(); save();
});

/** Cheap partial update so typing a title does not rebuild the whole DOM. */
function softLabels(){
  document.getElementById("subtitle").textContent = S.exam.name || "";
  document.querySelectorAll("[data-card^=topic]").forEach((el)=>{
    const ti = Number(el.dataset.card.replace("topic",""));
    const h = el.querySelector("h2");
    if(h && S.topics[ti]) h.childNodes[0].nodeValue =
      `${String(ti+1).padStart(2,"0")} · ${S.topics[ti].title || t("s_topics")}`;
  });
}

document.getElementById("btnLang").onclick = ()=>{
  UI = UI==="ko" ? "en" : "ko"; localStorage.setItem("em.ui", UI); render();
};
document.getElementById("btnYaml").onclick = ()=>{
  const p = document.getElementById("yamlPane");
  p.classList.toggle("hidden");
  document.getElementById("btnYaml").textContent = p.classList.contains("hidden") ? t("showyaml") : t("hideyaml");
};
document.getElementById("btnYamlClose").onclick = ()=>{
  document.getElementById("yamlPane").classList.add("hidden");
  document.getElementById("btnYaml").textContent = t("showyaml");
};
document.getElementById("btnDl").onclick = ()=>{
  const name = (slug(S.exam.name) || "exam") + ".yaml";
  const blob = new Blob([buildYaml()], {type:"text/yaml;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};
document.getElementById("btnCopy").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(buildYaml()); flash(t("copied")); }
  catch(e){ document.getElementById("yamlPane").classList.remove("hidden"); }
};
document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = (ev)=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ importYaml(String(r.result)); flash(t("loaded")); }
    catch(err){ alert("YAML: " + err.message); } };
  r.readAsText(f, "utf-8");
  ev.target.value = "";
};
document.getElementById("btnClear").onclick = ()=>{
  if(confirm(t("confirm_clear"))){ S = blankState(); render(); save(); }
};
document.getElementById("btnSample").onclick = ()=>{ S = sampleState(); render(); save(); };

      header:{v:"8바이트",mark:"trap"},
      usecase:{v:"DNS, DHCP, 스트리밍, VoIP",mark:"core"}}},
  ];
  tp.decisive.answer = "데이터를 보내기 전에 연결을 맺는가. 맺으면 상태를 유지할 수 있으므로 확인응답·재전송·순서·흐름 제어가 전부 가능해진다.";
  tp.decisive.pairs = [{a:"TCP 헤더 20바이트",b:"UDP 헤더 8바이트",
    why:"둘 다 짝수 바이트라 숫자만 외우면 뒤바뀐다.",clue:"기능이 많은 쪽이 헤더가 크다 — TCP가 20."}];

render();
