compression:
  l2:
    - item: Content vs process
      detail: What motivation is made of vs how it is reasoned about.
      mark: distinction
    - item: Regression
      detail: ERG allows it. Maslow does not.
      mark: distinction
    - item: Herzberg asymmetry
      detail: Hygiene removes dissatisfaction. It does not motivate.
      mark: trap
    - item: Expectancy
      detail: Multiplicative. One zero term zeroes the whole thing.
      mark: trap
    - item: Reliability and validity
      detail: Reliable but invalid is possible. Valid but unreliable is not.
      mark: distinction
    - item: Construct validity
      detail: A body of evidence, never a single coefficient.
      mark: trap
  l3:
    - Regression described - ERG
    - Comparison with a peer - Adams
    - Own effort chain - Vroom
    - Hygiene removes dissatisfaction only
    - Expectancy is multiplicative
    - McClelland - learned, not innate
    - Reliable can be invalid
    - Valid cannot be unreliable
    - Face validity - appearance, no weight
    - Construct validity - accumulated evidence

