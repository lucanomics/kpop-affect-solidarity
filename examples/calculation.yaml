compression:
  l2:
    - item: Mutually exclusive
      detail: Follow NPV. Always.
      mark: distinction
    - item: Reinvestment assumption
      detail: NPV → cost of capital. IRR → the IRR itself.
      mark: distinction
    - item: Multiple IRR
      detail: Only with non-conventional cash flows (more than one sign change).
      mark: exception
    - item: DDB and salvage
      detail: Not in the rate. Is a floor.
      mark: trap
    - item: Change of estimate
      detail: Prospective. Never restate.
      mark: trap
    - item: Lifetime depreciation
      detail: Identical under every method.
      mark: core
  l3:
    - Conflict → NPV wins
    - IRR assumes reinvestment at IRR
    - Sign changes > 1 → multiple IRR
    - PI is a ratio, ranks by efficiency
    - DDB - carrying amount x 2/n
    - Salvage is a floor, not a subtraction (DDB)
    - Estimate change - prospective only
    - Total depreciation is method-independent

