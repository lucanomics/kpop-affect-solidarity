topics:
  # ---------------------------------------------------------------- topic 01
  - id: tcp-udp
    title: TCP vs UDP
    archetype: it
    importance: A
    frequency: 최근 6회차 중 5회 출제
    why: >-
      두 프로토콜의 이름은 누구나 알지만, 선지는 항상 '어느 쪽이 무엇을 보장하는가'로
      갈린다. 헤더 크기와 순서 보장 여부가 특히 자주 뒤바뀌어 출제된다.
    core_question: 이 통신 요구사항에서 신뢰성과 지연 중 무엇을 포기해도 되는가?
    key_axis: 연결 설정 여부 → 신뢰성 · 순서 · 오버헤드
    prerequisites: [OSI 7계층, 포트 번호]
    sources: ['RFC 793', 'RFC 768']
    updated: '2026-07-30'
    one_sentence: >-
      TCP는 연결을 먼저 맺고 확인응답과 재전송으로 신뢰성과 순서를 보장하는 대신
      오버헤드가 크고, UDP는 연결 없이 그냥 보내서 빠른 대신 아무것도 보장하지 않는다.
    essentials:
      - TCP 헤더는 20바이트, UDP 헤더는 8바이트다.
      - 순서 보장은 TCP만 한다 — UDP는 도착 순서를 보장하지 않는다.
      - TCP는 3-way handshake로 연결, 4-way handshake로 종료한다.
      - UDP도 체크섬은 있다 — '오류 검출이 전혀 없다'는 선지는 오답이다.
      - 흐름 제어 · 혼잡 제어는 TCP만 수행한다.

    matrix:
      row_label: 프로토콜
      columns:
        - { key: conn,      label_ko: 연결 방식,   mark: distinction }
        - { key: reliable,  label_ko: 신뢰성,      mark: distinction }
        - { key: order,     label_ko: 순서 보장,   mark: trap }
        - { key: flow,      label_ko: 흐름 · 혼잡, mark: core }
        - { key: header,    label_ko: 헤더 크기,   mark: trap }
        - { key: speed,     label_ko: 속도 · 지연,  mark: core }
        - { key: usecase,   label_ko: 사용 예,     mark: core }
        - { key: exam,      label_ko: 시험 함정,   mark: trap }
      rows:
        - label: TCP
          sub: Transmission Control Protocol
          cells:
            conn: 연결형 — 3-way handshake
            reliable: 확인응답(ACK) + 재전송으로 보장
            order: { v: 시퀀스 번호로 보장, mark: distinction }
            flow: 슬라이딩 윈도우 · 혼잡 제어 모두 수행
            header: { v: 20바이트 (옵션 제외), mark: trap }
            speed: 상대적으로 느림
            usecase: HTTP, FTP, SMTP, SSH
            exam: { v: "'연결지향'과 '신뢰성'을 서로 다른 프로토콜에 붙인 선지", mark: trap }
        - label: UDP
          sub: User Datagram Protocol
          cells:
            conn: 비연결형 — handshake 없음
            reliable: 보장하지 않음 (재전송 없음)
            order: { v: 보장하지 않음, mark: distinction }
            flow: 수행하지 않음
            header: { v: 8바이트, mark: trap }
            speed: 빠름 — 오버헤드 최소
            usecase: DNS, DHCP, 스트리밍, VoIP
            exam: { v: "'오류 검출 기능이 전혀 없다' — 체크섬은 있으므로 오답", mark: trap }

    decisive:
      answer: >-
        데이터를 보내기 전에 연결을 맺는가. 맺으면 상태를 유지할 수 있으므로
        확인응답 · 재전송 · 순서 · 흐름 제어가 전부 가능해지고, 맺지 않으면 전부 불가능하다.
      pairs:
        - a: TCP 헤더 20바이트
          b: UDP 헤더 8바이트
          why: 둘 다 짝수 바이트라 숫자만 외우면 뒤바뀐다.
          clue: 기능이 많은 쪽이 헤더가 크다 — TCP가 20.
        - a: 오류 검출
          b: 오류 복구
          why: UDP에 체크섬이 있다는 사실 때문에 '신뢰성이 있다'로 오해한다.
          clue: UDP는 검출만 하고 버린다. 복구(재전송)는 TCP만 한다.

    traps:
      - cue: UDP는 오류 검출 기능이 없다.
        usually: 거짓
        exception: UDP 헤더에도 체크섬 필드가 있어 오류 검출은 수행한다
        why: 신뢰성이 없다는 사실을 오류 검출이 없다는 말로 확장해 버린다.
        source: RFC 768
      - cue: TCP는 항상 UDP보다 느리다.
        usually: 참
        exception: 손실률이 매우 높은 환경에서는 UDP 재전송 구현이 더 느릴 수 있다
        why: "'항상'이라는 단정어가 붙은 선지는 예외를 노린다."
        source: 일반 원리
      - cue: TCP 연결 종료는 3-way handshake로 이루어진다.
        usually: 거짓
        exception: 연결은 3-way, 종료는 4-way handshake
        why: 설정 절차만 외우고 종료 절차를 같은 숫자로 답한다.
        source: RFC 793

    evidence:
      - cell: { row: TCP, column: header }
        source: RFC 793
        exam: 샘플 2025-2회
        question: 문 43
        tested_as: '"TCP 헤더의 최소 길이는 20바이트이다"'
        risk: high
      - cell: { row: UDP, column: order }
        source: RFC 768
        exam: 샘플 2024-3회
        question: 문 51
        tested_as: '"순서 제어를 수행하지 않는다"'
        risk: mid

  # ---------------------------------------------------------------- topic 02
  - id: cpu-scheduling
    title: CPU 스케줄링 알고리즘
    archetype: it
    importance: A
    frequency: 최근 6회차 중 4회 출제
    why: 네 알고리즘의 선점 여부와 기아 발생 여부가 표 하나로 갈리는데, 매번 한 칸씩 바꿔 출제된다.
    core_question: 선점인가 비선점인가, 그리고 기아가 발생하는가?
    key_axis: 선점 여부 × 기아 발생 여부
    prerequisites: [프로세스 상태 전이]
    sources: ['운영체제 개론']
    updated: '2026-07-26'
    one_sentence: >-
      스케줄링 알고리즘은 CPU를 뺏을 수 있는가(선점)와 특정 프로세스가 영원히
      밀릴 수 있는가(기아)라는 두 축으로 구분된다.
    essentials:
      - FCFS는 비선점이며 호위 효과(convoy effect)가 발생한다.
      - SJF는 평균 대기시간이 최소지만 실행시간을 미리 알 수 없다.
      - SRT는 SJF의 선점형 버전이다.
      - RR의 성능은 타임 퀀텀 크기가 결정한다.
      - 우선순위 스케줄링의 기아는 에이징(aging)으로 해결한다.

    matrix:
      row_label: 알고리즘
      columns:
        - { key: preempt,  label_ko: 선점 여부,     mark: distinction }
        - { key: criteria, label_ko: 선택 기준,     mark: core }
        - { key: strength, label_ko: 강점,          mark: core }
        - { key: starve,   label_ko: 기아 발생,     mark: trap }
        - { key: weakness, label_ko: 한계,          mark: exception }
        - { key: exam,     label_ko: 시험 함정,     mark: trap }
      rows:
        - label: FCFS
          sub: First Come First Served
          cells:
            preempt: 비선점
            criteria: 도착 순서
            strength: 구현이 가장 단순, 공평
            starve: { v: 발생하지 않음, mark: distinction }
            weakness: 호위 효과 — 긴 작업이 앞서면 전체 지연
            exam: 공평하다는 이유로 평균 대기시간도 좋다고 착각
        - label: SJF
          sub: Shortest Job First
          cells:
            preempt: 비선점
            criteria: 실행시간이 짧은 순
            strength: 평균 대기시간 이론상 최소
            starve: { v: 발생 — 긴 작업이 계속 밀림, mark: trap }
            weakness: { v: 실행시간을 미리 알 수 없어 실제 적용이 어려움, mark: exception }
            exam: { v: 최적이라는 서술만 보고 실현 가능하다고 판단, mark: trap }
        - label: SRT
          sub: Shortest Remaining Time
          cells:
            preempt: { v: 선점, mark: distinction }
            criteria: 남은 실행시간이 짧은 순
            strength: SJF의 응답성 개선
            starve: { v: 발생, mark: trap }
            weakness: 문맥 교환 오버헤드 증가
            exam: { v: SJF와 SRT의 선점 여부를 뒤바꾼 선지, mark: trap }
        - label: RR
          sub: Round Robin
          cells:
            preempt: { v: 선점, mark: distinction }
            criteria: 타임 퀀텀 단위 순환
            strength: 응답시간이 균등, 대화형에 적합
            starve: { v: 발생하지 않음, mark: distinction }
            weakness: 퀀텀이 너무 작으면 문맥 교환 비용 폭증
            exam: 퀀텀이 매우 커지면 FCFS와 같아진다는 점
        - label: 우선순위
          sub: Priority Scheduling
          cells:
            preempt: 선점 · 비선점 모두 가능
            criteria: 우선순위 값
            strength: 중요 작업 우선 처리
            starve: { v: 발생 — 낮은 우선순위가 무한 대기, mark: trap }
            weakness: { v: 해결책은 에이징(aging), mark: exception }
            exam: { v: 기아 해결책을 '선점 전환'으로 적은 선지, mark: trap }

    decisive:
      answer: >-
        실행 중인 프로세스에서 CPU를 뺏을 수 있는가. 뺏을 수 있으면 선점형이고
        응답성이 좋아지는 대신 문맥 교환 비용이 늘어난다.
      pairs:
        - a: SJF
          b: SRT
          why: 선택 기준이 사실상 같아서 선점 여부만 다르다.
          clue: 이름에 Remaining이 있으면 선점형이다.
        - a: FCFS
          b: RR
          why: 둘 다 도착 순서를 따르므로 혼동된다.
          clue: 타임 퀀텀이 언급되면 RR이다. 퀀텀이 무한대면 FCFS와 동일.

    traps:
      - cue: SJF는 항상 최적의 스케줄링이다.
        usually: 참 (이론상)
        exception: 실행시간을 알 수 없으므로 실제 시스템에서는 적용 불가
        why: 이론적 최적성과 실현 가능성을 구분하지 않는다.
        source: 운영체제 개론
      - cue: 라운드 로빈에서는 기아가 발생한다.
        usually: 거짓
        exception: 모든 프로세스가 순환하므로 기아는 발생하지 않는다
        why: 선점형이면 기아가 생긴다는 잘못된 일반화.
        source: 운영체제 개론

    evidence:
      - cell: { row: SRT, column: preempt }
        source: 운영체제 개론
        exam: 샘플 2025-1회
        question: 문 62
        tested_as: '"SJF의 선점형 기법에 해당하는 것은?"'
        risk: high

