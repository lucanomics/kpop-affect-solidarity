      detail: TCP만. UDP는 검출만 하고 복구는 안 한다.
      mark: distinction
    - item: handshake
      detail: 연결 3-way / 종료 4-way
      mark: trap
    - item: 선점형
      detail: SRT, RR, (우선순위는 둘 다 가능)
      mark: distinction
    - item: 기아 발생
      detail: SJF, SRT, 우선순위 — RR과 FCFS는 발생하지 않음
      mark: trap
    - item: 기아 해결
      detail: 에이징(aging)
      mark: core
