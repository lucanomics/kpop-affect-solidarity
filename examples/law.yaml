compression:
  l2:
    - item: 제소기간
      detail: 안 날 90일 / 있은 날 1년 — 먼저 도래하는 때. 심판은 90일 / 180일.
      mark: trap
    - item: 심리 범위
      detail: 심판 = 위법 + 부당 / 소송 = 위법만
      mark: distinction
    - item: 집행정지
      detail: 소 제기만으로는 정지되지 않는다. 별도 신청 필요.
      mark: trap
    - item: 소극적 요건의 소명 책임
      detail: 공공복리 저해 우려는 행정청이 소명
      mark: trap
    - item: 행정심판 전치
      detail: 임의적 전치가 원칙. 필요적 전치는 개별법에 규정된 경우만.
      mark: exception
  l3:
    - 90일 / 1년 — 먼저 도래하는 때
    - 심판 180일, 소송 1년 (뒷자리가 다르다)
    - 부당까지 = 심판, 위법만 = 소송
    - 소 제기 ≠ 집행정지
    - 공공복리 요건은 행정청이 소명
    - 재결 고유의 위법 = 재결도 소송 대상
    - 전치주의는 임의적이 원칙

